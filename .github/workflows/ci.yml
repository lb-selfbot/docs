name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "latest"
      
      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Upload as artifact
        uses: actions/upload-artifact@v3
        with:
          name: docs
          path: build
